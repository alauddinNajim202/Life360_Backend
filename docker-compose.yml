version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: family_backend:latest
    container_name: family_backend
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: family_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-family_manager}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-family_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    vvolumes:
      - family_dbdata:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
